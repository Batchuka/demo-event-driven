name: import-event-driven

services:
  orchestrator:
    build:
      context: .
      args:
        MODULE: orchestrator
    ports:
      - "8080:8080"
    environment:
      TZ: America/Sao_Paulo
      FINANCE_URL: http://finance:8081
      CUSTOMS_URL: http://customs-clearance:8082

  finance:
    build:
      context: .
      args:
        MODULE: finance
    ports:
      - "8081:8081"
    environment:
      TZ: America/Sao_Paulo
      ORCHESTRATOR_URL: http://orchestrator:8080
      SIMULATION_DELAY: 3s

  customs-clearance:
    build:
      context: .
      args:
        MODULE: customs-clearance
    ports:
      - "8082:8082"
    environment:
      TZ: America/Sao_Paulo
      ORCHESTRATOR_URL: http://orchestrator:8080
      SIMULATION_DELAY: 8s

  logistics:
    build:
      context: .
      args:
        MODULE: logistics
    ports:
      - "8083:8083"
    environment:
      TZ: America/Sao_Paulo
      ORCHESTRATOR_URL: http://orchestrator:8080
